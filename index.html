<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <style>
            #btn-start {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.85);
                color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: sans-serif;
                font-size: 1.4rem;
                z-index: 9999;
                cursor: pointer;
                text-align: center;
                padding: 20px;
            }
        </style>

        <script>
            function startExperience() {
                var btn = document.getElementById('btn-start');
                btn.style.display = 'none';

                var vids = document.querySelectorAll('video');
                vids.forEach(function(v) {
                    v.play().then(() => {
                        v.pause();
                    }).catch(e => console.log("Permiso de video:", e));
                });
            }

            AFRAME.registerComponent('videohandler', {
                schema: {
                    target: { type: 'string' }
                },
                init: function () {
                    var marker = this.el;
                    this.vid = document.querySelector(this.data.target);

                    marker.addEventListener('markerFound', function () {
                        if (this.vid) {
                            this.vid.currentTime = 0;
                            var playPromise = this.vid.play();
                            if (playPromise !== undefined) {
                                playPromise.catch(error => console.log("Error al reproducir:", error));
                            }
                        }
                    }.bind(this));

                    marker.addEventListener('markerLost', function () {
                        if (this.vid) {
                            this.vid.pause();
                        }
                    }.bind(this));
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <div id="btn-start" onclick="startExperience()">
            Toca la pantalla para iniciar la experiencia AR
        </div>

        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false;"
            arjs="sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <!-- Asegúrate de que los nombres de archivo en la carpeta assets/ sean idénticos (respetando minúsculas) -->
                <video id="vid1" src="assets/video1.mp4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
                <video id="vid2" src="assets/video2.mp4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
                <video id="vid3" src="assets/video3.mp4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
            </a-assets>

            <!-- MARCADOR 1 -->
            <a-marker type="pattern" preset="custom" url="assets/marker1.patt" videohandler="target: #vid1" smooth="true" id="marker1">
                <a-video src="#vid1" width="1.6" height="0.9" position="0 0.5 0" rotation="-90 0 0" class="clickable" gesture-handler></a-video>
            </a-marker>

            <!-- MARCADOR 2 -->
            <a-marker type="pattern" preset="custom" url="assets/marker2.patt" videohandler="target: #vid2" smooth="true" id="marker2">
                <a-video src="#vid2" width="1.6" height="0.9" position="0 0.5 0" rotation="-90 0 0" class="clickable" gesture-handler></a-video>
            </a-marker>

            <!-- MARCADOR 3 -->
            <a-marker type="pattern" preset="custom" url="assets/marker3.patt" videohandler="target: #vid3" smooth="true" id="marker3">
                <a-video src="#vid3" width="1.6" height="0.9" position="0 0.5 0" rotation="-90 0 0" class="clickable" gesture-handler></a-video>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
