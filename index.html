<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <!-- Componente personalizado para controlar la reproducción de cada video independiente -->
        <script>
            AFRAME.registerComponent('videohandler', {
                schema: {
                    target: { type: 'string' }
                },
                init: function () {
                    var marker = this.el;
                    this.vid = document.querySelector(this.data.target);

                    marker.addEventListener('markerFound', function () {
                        if (this.vid) {
                            this.vid.play();
                        }
                    }.bind(this));

                    marker.addEventListener('markerLost', function () {
                        if (this.vid) {
                            this.vid.pause();
                        }
                    }.bind(this));
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false;"
            arjs="sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <!-- CARGA DE RECURSOS (Ambos videos) -->
            <a-assets>
                <!-- Video del Proyecto 1 (Cangrejos) -->
                <video
                    id="vid1"
                    src="assets/cangrejos.mp4"
                    preload="auto"
                    response-type="arraybuffer"
                    loop
                    crossorigin
                    webkit-playsinline
                    autoplay
                    muted
                    playsinline
                ></video>

                <!-- Video del Proyecto 2 (Torre Eiffel) -->
                <video
                    id="vid2"
                    src="assets/torre_eiffel.mp4"
                    preload="auto"
                    response-type="arraybuffer"
                    loop
                    crossorigin
                    webkit-playsinline
                    autoplay
                    muted
                    playsinline
                ></video>
            </a-assets>

            <!-- MARCADOR 1: Proyecto Cangrejos -->
            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker1.patt"
                videohandler="target: #vid1"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
            >
                <a-video
                    src="#vid1"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                ></a-video>
            </a-marker>

            <!-- MARCADOR 2: Proyecto Torre Eiffel -->
            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker2.patt"
                videohandler="target: #vid2"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerB"
            >
                <a-video
                    src="#vid2"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                ></a-video>
            </a-marker>

            <!-- Cámara de la experiencia -->
            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
