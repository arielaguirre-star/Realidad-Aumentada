<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <style>
            /* Botón para desbloquear autoplay en móviles */
            #btn-start {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.7);
                color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: sans-serif;
                font-size: 1.5rem;
                z-index: 9999;
                cursor: pointer;
                text-align: center;
                padding: 20px;
            }
        </style>

        <script>
            // Desbloquear audio/video al tocar la pantalla por primera vez
            function startExperience() {
                var btn = document.getElementById('btn-start');
                btn.style.display = 'none';

                var vids = document.querySelectorAll('video');
                vids.forEach(function(v) {
                    v.play().then(() => {
                        v.pause(); // Lo pausamos hasta que escanee el marcador
                    }).catch(e => console.log(e));
                });
            }

            AFRAME.registerComponent('videohandler', {
                schema: {
                    target: { type: 'string' }
                },
                init: function () {
                    var marker = this.el;
                    this.vid = document.querySelector(this.data.target);

                    marker.addEventListener('markerFound', function () {
                        if (this.vid) {
                            this.vid.currentTime = 0;
                            var playPromise = this.vid.play();
                            if (playPromise !== undefined) {
                                playPromise.catch(error => console.log("Error al reproducir:", error));
                            }
                        }
                    }.bind(this));

                    marker.addEventListener('markerLost', function () {
                        if (this.vid) {
                            this.vid.pause();
                        }
                    }.bind(this));
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <!-- PANTALLA DE INICIO (Garantiza permisos de reproducción en el móvil) -->
        <div id="btn-start" onclick="startExperience()">
            Toca la pantalla para comenzar la experiencia AR
        </div>

        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false;"
            arjs="sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <video
                    id="vid1"
                    src="assets/cangrejos.mp4"
                    preload="auto"
                    response-type="arraybuffer"
                    loop
                    crossorigin="anonymous"
                    webkit-playsinline
                    playsinline
                    muted
                ></video>

                <video
                    id="vid2"
                    src="assets/torre_eiffel.mp4"
                    preload="auto"
                    response-type="arraybuffer"
                    loop
                    crossorigin="anonymous"
                    webkit-playsinline
                    playsinline
                    muted
                ></video>
            </a-assets>

            <!-- MARCADOR 1: Cangrejos -->
            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker1.patt"
                videohandler="target: #vid1"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
            >
                <a-video
                    src="#vid1"
                    scale="1.5 1.5 1.5"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                ></a-video>
            </a-marker>

            <!-- MARCADOR 2: Torre Eiffel -->
            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker2.patt"
                videohandler="target: #vid2"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerB"
            >
                <a-video
                    src="#vid2"
                    scale="1.5 1.5 1.5"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                ></a-video>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
