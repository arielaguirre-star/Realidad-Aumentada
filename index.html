<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        
        <!-- Librerías A-Frame y AR.js -->
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            /* Forzar a la cámara web de AR.js a mostrarse de fondo sin quedar tapada */
            #arjs-video {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                object-fit: cover !important;
                z-index: -2 !important;
            }

            /* Ajuste del canvas 3D sobre la cámara */
            .a-canvas {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                z-index: -1 !important;
            }

            #btn-start {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.85);
                color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: sans-serif;
                font-size: 1.3rem;
                z-index: 9999;
                cursor: pointer;
                text-align: center;
                padding: 20px;
                box-sizing: border-box;
            }

            #btn-audio {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 60px;
                height: 60px;
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.7);
                border: 2px solid #ffffff;
                color: white;
                font-size: 24px;
                display: none;
                justify-content: center;
                align-items: center;
                z-index: 9998;
                cursor: pointer;
                user-select: none;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            }
        </style>

        <script>
            var isMuted = true;

            function startExperience() {
                document.getElementById('btn-start').style.display = 'none';
                document.getElementById('btn-audio').style.display = 'flex';

                // Inicializar assets de video
                var vids = document.querySelectorAll('a-assets video');
                vids.forEach(function(v) {
                    v.setAttribute('playsinline', '');
                    v.setAttribute('webkit-playsinline', '');
                    v.muted = true;
                    
                    var promise = v.play();
                    if (promise !== undefined) {
                        promise.then(() => {
                            v.pause();
                        }).catch(e => console.log(e));
                    }
                });
            }

            function toggleAudio() {
                var btn = document.getElementById('btn-audio');
                var vids = document.querySelectorAll('a-assets video');
                
                isMuted = !isMuted;

                vids.forEach(function(v) {
                    v.muted = isMuted;
                });

                btn.innerHTML = isMuted ? '🔇' : '🔊';
            }

            AFRAME.registerComponent('videohandler', {
                schema: {
                    target: { type: 'string' }
                },
                init: function () {
                    var marker = this.el;
                    this.vid = document.querySelector(this.data.target);

                    marker.addEventListener('markerFound', function () {
                        if (this.vid) {
                            this.vid.muted = isMuted;
                            this.vid.currentTime = 0;
                            var playPromise = this.vid.play();
                            if (playPromise !== undefined) {
                                playPromise.catch(error => console.log("Error al reproducir:", error));
                            }
                        }
                    }.bind(this));

                    marker.addEventListener('markerLost', function () {
                        if (this.vid) {
                            this.vid.pause();
                        }
                    }.bind(this));
                }
            });
        </script>
    </head>

    <body>
        <div id="btn-start" onclick="startExperience()">
            Toca la pantalla para iniciar la experiencia AR
        </div>

        <div id="btn-audio" onclick="toggleAudio()">🔇</div>

        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            embedded
            arjs="sourceType: webcam; debugUIEnabled: false;"
            id="scene"
        >
            <a-assets>
                <video id="vid1" src="assets/video1.mp4?v=4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
                <video id="vid2" src="assets/video2.mp4?v=4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
                <video id="vid3" src="assets/video3.mp4?v=4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
            </a-assets>

            <!-- MARCADOR 1 -->
            <a-marker type="pattern" preset="custom" url="assets/marker1.patt?v=4" videohandler="target: #vid1" smooth="true" id="marker1">
                <a-video src="#vid1" width="1.6" height="0.9" position="0 0.5 0" rotation="-90 0 0"></a-video>
            </a-marker>

            <!-- MARCADOR 2 -->
            <a-marker type="pattern" preset="custom" url="assets/marker2.patt?v=4" videohandler="target: #vid2" smooth="true" id="marker2">
                <a-video src="#vid2" width="1.6" height="0.9" position="0 0.5 0" rotation="-90 0 0"></a-video>
            </a-marker>

            <!-- MARCADOR 3 -->
            <a-marker type="pattern" preset="custom" url="assets/marker3.patt?v=4" videohandler="target: #vid3" smooth="true" id="marker3">
                <a-video src="#vid3" width="1.6" height="0.9" position="0 0.5 0" rotation="-90 0 0"></a-video>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
